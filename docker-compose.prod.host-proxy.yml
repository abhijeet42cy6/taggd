# Production when Cloud SQL Auth Proxy runs on the HOST (systemd).
# Install first: sudo bash scripts/setup-cloud-sql-proxy-vm.sh
#
#   docker compose -f docker-compose.prod.host-proxy.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - /cloudsql:/cloudsql:ro
      - ./excel_files_imp:/app/excel_files_imp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: always
