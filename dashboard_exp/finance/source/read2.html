<!DOCTYPE html>
<html>
<head>
<title>Excel Reader</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<pre id="out" style="font-size:11px;white-space:pre-wrap;max-height:98vh;overflow:auto"></pre>
<script>
const log = s => { document.getElementById('out').textContent += s + '\n'; };

async function readFile(url, name) {
  log('\n\n════════════ FILE: ' + name + ' ════════════');
  const resp = await fetch(url);
  const ab = await resp.arrayBuffer();
  const wb = XLSX.read(ab, { type: 'array' });
  log('SHEETS: ' + wb.SheetNames.join(' | '));
  wb.SheetNames.forEach(sn => {
    const ws = wb.Sheets[sn];
    const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
    log('\n--- SHEET: ' + sn + ' (' + data.length + ' rows) ---');
    data.slice(0, 30).forEach((row, i) => log(i + ': ' + JSON.stringify(row)));
    if(data.length > 30) log('... (' + data.length + ' total rows)');
  });
}

(async () => {
  await readFile('../source/FY2526.xlsx', 'FY2526');
  await readFile('../source/FY2425.xlsx', 'FY2425');
  log('\n\nDONE');
})();
</script>
</body>
</html>
