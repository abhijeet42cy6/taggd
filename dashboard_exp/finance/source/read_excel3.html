<!DOCTYPE html>
<html>
<head><title>Excel Full Reader</title></head>
<body>
<pre id="out" style="font-size:9px;white-space:pre-wrap;max-height:90vh;overflow:auto;">Reading...</pre>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
function excelDateToStr(serial) {
  if (typeof serial !== 'number' || serial < 40000) return serial;
  const d = new Date(Math.round((serial - 25569) * 86400 * 1000));
  return d.toLocaleDateString('en-IN', {month:'short', year:'2-digit'}).replace(' ','').replace(',','');
}

async function readExcelFull(url, label) {
  const resp = await fetch(url);
  const ab = await resp.arrayBuffer();
  const wb = XLSX.read(ab, {type:'array'});
  
  const result = { label, sheets: {} };
  
  wb.SheetNames.forEach(name => {
    const ws = wb.Sheets[name];
    const json = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    if (!json.length) return;
    const hdr = json[0].map(h => typeof h==='number' && h>40000 ? excelDateToStr(h) : h);
    result.sheets[name] = {
      headers: hdr,
      rowCount: json.length - 1,
      sampleRows: json.slice(1, 4),
      // Get unique values for dimension columns
      projects: [...new Set(json.slice(1).map(r=>r[1]).filter(Boolean))],
      verticals: [...new Set(json.slice(1).map(r=>r[2]).filter(Boolean))],
      regions: [...new Set(json.slice(1).map(r=>r[3]).filter(Boolean))],
    };
  });
  
  return result;
}

(async () => {
  const [d1, d2] = await Promise.all([
    readExcelFull('../source/FY24-25_Finance_Data.xlsx','FY24-25'),
    readExcelFull('../source/FY25-26_Finance_Data.xlsx','FY25-26')
  ]);
  
  let out = '';
  [d1, d2].forEach(d => {
    out += `\n========== ${d.label} ==========\n`;
    Object.entries(d.sheets).forEach(([name, info]) => {
      out += `\n--- ${name} (${info.rowCount} rows) ---\n`;
      out += `Headers: ${JSON.stringify(info.headers)}\n`;
      info.sampleRows.forEach((r,i) => out += `  R${i+1}: ${JSON.stringify(r)}\n`);
      if (info.projects.length < 30) out += `  Projects: ${info.projects.join(', ')}\n`;
      if (info.verticals.length) out += `  Verticals: ${info.verticals.join(', ')}\n`;
      if (info.regions.length) out += `  Regions: ${info.regions.join(', ')}\n`;
    });
  });
  
  document.getElementById('out').textContent = out;
  console.log(out);
})();
</script>
</body>
</html>
