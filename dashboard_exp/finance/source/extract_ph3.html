<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Extract FY2526 Practice Heads</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<pre id="out" style="font-size:11px;background:#f0f0f0;padding:10px;max-height:90vh;overflow:auto;"></pre>
<script>
const out = document.getElementById('out');
function log(s) { out.textContent += s + '\n'; console.log(s); }

async function loadWB(url) {
  const resp = await fetch(url);
  const buf = await resp.arrayBuffer();
  return XLSX.read(buf, {type:'array'});
}

async function run() {
  log('Loading FY25-26...');
  const wb = await loadWB('FY25-26_Finance_Data.xlsx');
  log('Sheets: ' + wb.SheetNames.join(', '));

  // Find the Revenue Budget or any sheet with account mapping
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    if (!ws) continue;
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', header:1});
    if (!rows || rows.length === 0) continue;
    
    const header = rows[0] ? rows[0].map(c => String(c||'').toLowerCase()) : [];
    const hasPH = header.some(k => k.includes('practice'));
    
    if (hasPH) {
      log('\n--- Sheet: ' + name + ' ---');
      log('Headers: ' + rows[0].join(' | '));
      for (let i = 1; i < rows.length; i++) {
        if (rows[i] && rows[i].some(v => v !== '' && v !== null && v !== 0)) {
          // Only print FY, Project, Vertical, Region, Sub Region, Region Head, Practice Head (first 7 cols)
          const row = rows[i].slice(0, 7);
          if (row.some(v => v !== '' && v !== null)) {
            log('  ' + row.join(' | '));
          }
        }
      }
      break; // One sheet is enough (they all have same accounts)
    }
  }
  log('\n=== DONE ===');
}
run();
</script>
</body>
</html>
