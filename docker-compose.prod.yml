# Production / new VM — app + Cloud SQL Auth Proxy (private IP).
#
# Prerequisites:
#   1. Copy .env.example → .env and set secrets (see scripts/fetch-cloudsql-database-url.sh).
#   2. VM service account: roles/cloudsql.client (+ secretmanager.secretAccessor if using fetch script).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# DATABASE_URL must use the Unix socket (proxy creates /cloudsql/CONNECTION_NAME):
#   postgresql+psycopg://tgddata_app:PASSWORD@/tgddata?host=/cloudsql/taggd-491107:asia-south1:tgddata-pg-prod
#
# Host systemd proxy instead: see docker-compose.prod.host-proxy.yml

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
    command:
      - /cloud-sql-proxy
      - --structured-logs
      - --unix-socket=/cloudsql
      - ${CLOUDSQL_CONNECTION_NAME:-taggd-491107:asia-south1:tgddata-pg-prod}
    volumes:
      - cloudsql_socket:/cloudsql
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      - cloud-sql-proxy
    volumes:
      - cloudsql_socket:/cloudsql:ro
      - ./excel_files_imp:/app/excel_files_imp
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  cloudsql_socket:
