# Local + GCP VM: copy .env.example to .env and set values.
# Compose loads `.env` from this directory for ${...} substitution and passes vars into containers.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - sqlite_data:/app/db_data
    environment:
      DATABASE_URL: sqlite:////app/db_data/revenue_generator.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
