# Local + new VM deploy: copy .env.example to .env and set values.
# PostgreSQL is the default database (see postgres service). For Cloud SQL / AWS RDS,
# remove or disable the postgres service and set DATABASE_URL in .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgddata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgddata_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tgddata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./excel_files_imp:/app/excel_files_imp
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tgddata}:${POSTGRES_PASSWORD:-tgddata_dev}@postgres:5432/${POSTGRES_DB:-tgddata}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
